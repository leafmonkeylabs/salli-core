# Releases the TypeScript packages: the `salli` CLI, @leafmonkeylabs/salli-sdk
# and @leafmonkeylabs/salli-console.
#
# Push a tag to release one package (see RELEASING.md):
#   cli-v0.2.0     →  salli 0.2.0 on npm, plus standalone binaries
#   sdk-v0.2.0     →  @leafmonkeylabs/salli-sdk 0.2.0 on npm
#   server-v0.4.0  →  @leafmonkeylabs/salli-console 0.4.0 on npm: the console
#                     ships at the server's version (decision 24), beside the
#                     image image.yml builds from the same tag, and the
#                     server's Python wheel
#
# Each package's CycloneDX SBOM (`*.cdx.json`) is attached to its release.
#
# The npm package is *staged*, not published: it reaches users only once a
# maintainer approves it on npmjs.com with 2FA. The GitHub release is made
# as a draft for the same reason; the console's files join the server's
# release for its tag, since a tag holds one release. Run it by hand ("Run workflow") for a dry
# run that builds and tests everything and publishes nothing.
#
# Third-party actions are pinned to commit SHAs: this workflow can publish.
name: Release

on:
  push:
    tags: ['cli-v*', 'sdk-v*', 'server-v*']
  workflow_dispatch:
    inputs:
      package:
        description: Package to rehearse a release of (nothing is published)
        type: choice
        options: [cli, sdk, console]
        default: cli

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  # npm stage needs npm 11.15 or later.
  NPM_VERSION: '11.19.1'
  BUN_VERSION: '1.3.14'

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.which.outputs.package }}
      name: ${{ steps.which.outputs.name }}
      version: ${{ steps.which.outputs.version }}
      dist_tag: ${{ steps.which.outputs.dist_tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Which package, at which version
        id: which
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            package="${GITHUB_REF_NAME%%-v*}"
            tag_version="${GITHUB_REF_NAME#*-v}"
            # The server's tag releases the console, at the server's version.
            [ "$package" = server ] && package=console
          else
            package="$INPUT_PACKAGE"
            tag_version=""
          fi
          case "$package" in
            cli|sdk|console) ;;
            *) echo "::error::Unknown package '$package'"; exit 1 ;;
          esac
          name=$(node -p "require('./packages/$package/package.json').name")
          version=$(node -p "require('./packages/$package/package.json').version")
          if [ -n "$tag_version" ] && [ "$tag_version" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says $tag_version, but packages/$package/package.json says $version"
            exit 1
          fi
          if [ "$package" = console ]; then
            server=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            if [ "$version" != "$server" ]; then
              echo "::error::packages/console/package.json says $version, but the server (pyproject.toml) is $server"
              exit 1
            fi
            # Its SDK must be on npm first, or an edition can't build against it.
            sdk=$(node -p "require('./packages/console/package.json').dependencies['@leafmonkeylabs/salli-sdk']")
            if ! npm view "@leafmonkeylabs/salli-sdk@$sdk" version >/dev/null 2>&1; then
              echo "::error::@leafmonkeylabs/salli-sdk@$sdk, which the console depends on, is not on npm: release it first (sdk-v$sdk)"
              [ "$GITHUB_EVENT_NAME" = push ] && exit 1
            fi
          fi
          # A pre-release (0.2.0-beta.1) must not become `latest`.
          case "$version" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          {
            echo "package=$package"
            echo "name=$name"
            echo "version=$version"
            echo "dist_tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $name $version ($dist_tag)" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: The generated SDK matches openapi/openapi.json
        run: npm run check:generated
      - name: Build
        run: |
          npm run build
          node packages/cli/dist/salli.js --version
      - name: Pack the exact tarball that will be published
        id: pack
        working-directory: packages/${{ steps.which.outputs.package }}
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          tarball=$(npm pack --pack-destination "$RUNNER_TEMP/pack" | tail -1)
          tar -tzf "$RUNNER_TEMP/pack/$tarball" | sort
          tar -tzf "$RUNNER_TEMP/pack/$tarball" | grep -qx package/LICENSE
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: SBOM of the npm package (CycloneDX)
        working-directory: packages/${{ steps.which.outputs.package }}
        run: npm sbom --sbom-format cyclonedx --omit dev > "$RUNNER_TEMP/pack/${{ steps.pack.outputs.tarball }}.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-sbom
          path: ${{ runner.temp }}/pack/*.cdx.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pack/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  wheel:
    # The server's tag: its Python wheel and a CycloneDX SBOM of what it
    # pins (uv.lock, without dev dependencies), attached to the release.
    needs: verify
    if: needs.verify.outputs.package == 'console'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Build the wheel and its SBOM
        run: |
          uv build --wheel --out-dir dist
          wheel=$(basename dist/*.whl)
          uv export --format cyclonedx1.5 --no-dev --frozen --preview-features sbom-export > "dist/$wheel.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheel
          path: dist/*
          if-no-files-found: error

  binaries:
    # Each binary is built on its own platform, so it embeds that platform's
    # native keychain module (see packages/cli/scripts/build-binaries.mjs).
    needs: verify
    if: needs.verify.outputs.package == 'cli'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-2025, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci
      - run: npm run build --workspace @leafmonkeylabs/salli
      - name: Build the ${{ matrix.target }} binary on its own platform
        run: npm run binaries -- --host
      - name: It runs
        run: |
          file="salli-${{ matrix.target }}"
          [ "${{ matrix.target }}" = windows-x64 ] && file="$file.exe"
          test -f "packages/cli/dist/bin/$file"
          "packages/cli/dist/bin/$file" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: packages/cli/dist/bin/salli-*
          if-no-files-found: error

  publish:
    needs: [verify, binaries]
    # The binaries are only built for the CLI; an SDK release skips them.
    if: >-
      !cancelled() && github.event_name == 'push'
      && needs.verify.result == 'success'
      && (needs.binaries.result == 'success' || needs.binaries.result == 'skipped')
    runs-on: ubuntu-24.04
    # The trusted publisher on npmjs.com names this environment. Give it
    # required reviewers in the repository settings to gate staging too.
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@$NPM_VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pack
      - name: Unpack the tested tarball
        # `npm stage publish` packs the directory it runs in: this one holds
        # exactly what was tested and packed above.
        run: tar -xzf "$RUNNER_TEMP/pack/${{ needs.verify.outputs.tarball }}" -C "$RUNNER_TEMP"
      - name: First release only — a stage-only bootstrap token
        # Trusted publishing can only be set up for a package that exists.
        # Until then, an environment secret holds a stage-only token (see
        # RELEASING.md); delete it once the trusted publisher is configured.
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          if [ -n "$NPM_BOOTSTRAP_TOKEN" ]; then
            npm config set "//registry.npmjs.org/:_authToken" "$NPM_BOOTSTRAP_TOKEN"
            echo "::warning::Staging with the bootstrap token. Configure trusted publishing and delete NPM_BOOTSTRAP_TOKEN."
          fi
      - name: Stage ${{ needs.verify.outputs.name }} ${{ needs.verify.outputs.version }} on npm
        working-directory: ${{ runner.temp }}/package
        run: npm stage publish --access public --provenance --tag "${{ needs.verify.outputs.dist_tag }}"
      - name: Next step
        run: |
          {
            echo "### ${{ needs.verify.outputs.name }} ${{ needs.verify.outputs.version }} is staged on npm"
            echo
            echo "Approve it on npmjs.com (or \`npm stage list ${{ needs.verify.outputs.name }}\` then \`npm stage approve <id>\`),"
            echo "then publish the draft GitHub release."
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [verify, binaries, wheel, publish]
    if: >-
      !cancelled() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        env:
          PACKAGE: ${{ needs.verify.outputs.package }}
        run: |
          # The console's tag is the server's, and its files go on the
          # server's release beside the image's notes: its own name keeps
          # them apart from anything else attached there.
          sums=SHA256SUMS
          [ "$PACKAGE" = console ] && sums=SHA256SUMS-console
          rm -f "$sums"
          sha256sum -- * > "$sums"
          cat "$sums"
      - name: Draft the GitHub release
        if: needs.verify.outputs.package != 'console'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.verify.outputs.package }}
          NAME: ${{ needs.verify.outputs.name }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
        run: |
          prerelease=""
          [ "$DIST_TAG" = next ] && prerelease="--prerelease"
          # Written for when the draft is published: after npm approval.
          if [ "$PACKAGE" = cli ]; then
            install="npm install --global $NAME@$VERSION"
            extra="Without Node.js, use the standalone binary for your platform below; check it against \`SHA256SUMS\`. The macOS and Windows binaries aren't code-signed yet."
          else
            install="npm install $NAME@$VERSION"
            extra=""
          fi
          cat > notes.md <<NOTES
          \`$NAME\` $VERSION.

          \`\`\`bash
          $install
          \`\`\`

          Needs Node.js 22.12 or later. $extra

          Built and published from this repository by GitHub Actions, with npm provenance.
          NOTES
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft $prerelease \
            --title "$NAME $VERSION" --notes-file notes.md
      - name: The console's files, on the server's release
        # A tag holds one GitHub release, and server-v<version> is the
        # server's (RELEASING.md). The console's package and its checksums
        # join that release, with a section saying how to install it; when
        # the release isn't there yet, this makes it as a draft, for the
        # maintainer to write the server's notes into.
        if: needs.verify.outputs.package == 'console'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.verify.outputs.name }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
        run: |
          heading="## The console on npm"
          cat > console.md <<NOTES
          $heading
          \`$NAME\` $VERSION, for editions that build on the open console: published with npm provenance once a maintainer approves it, with the package and its checksums (\`SHA256SUMS-console\`) attached here.

          \`\`\`bash
          npm install $NAME@$VERSION
          \`\`\`
          NOTES
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md 2>/dev/null; then
            gh release upload "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --clobber
            if ! grep -qxF "$heading" notes.md; then
              printf '\n' >> notes.md
              cat console.md >> notes.md
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            fi
          else
            prerelease=""
            [ "$DIST_TAG" = next ] && prerelease="--prerelease"
            gh release create "$GITHUB_REF_NAME" assets/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag --draft $prerelease \
              --title "Server $VERSION" --notes-file console.md
          fi
