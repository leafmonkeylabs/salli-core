name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Actions are pinned to commit SHAs (Dependabot keeps them current).
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Migration tests create and drop their own databases on this server.
      SALLI_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.18"
      - run: uv sync --group dev --frozen
      - name: Lint
        run: |
          uv run ruff check src tests benchmark
          uv run ruff format --check src tests benchmark
      - name: Type-check the extension seam, salli-server, sign-in and the money path
        # The rest of the codebase predates strict typing; these modules are
        # held to it so the seam extensions build on (salli-server's commands
        # among it), how people sign in, and the code every amount and
        # exchange rate passes through, stay precise.
        run: >-
          uv run pyright
          src/salli/extensions.py src/salli/application/defaults.py
          src/salli/domain/usage.py src/salli/migrations/support.py
          src/salli/interfaces/cli
          src/salli/domain/currency.py src/salli/domain/money.py
          src/salli/application/fx.py src/salli/adapters/fx
          src/salli/domain/dedup
          src/salli/adapters/parsing/support.py src/salli/adapters/parsing/amounts.py
          src/salli/adapters/parsing/dates.py src/salli/adapters/parsing/csv_import.py
          src/salli/adapters/parsing/ofx.py src/salli/adapters/parsing/qif.py
          src/salli/adapters/parsing/camt053.py src/salli/adapters/parsing/mt940.py
          src/salli/domain/rules src/salli/domain/export src/salli/domain/reports/insights.py src/salli/domain/reports/forecast.py src/salli/domain/reports/signals.py
          src/salli/application/services/rules_service.py
          src/salli/application/services/insights_service.py
          src/salli/interfaces/api/routers/insights.py
          src/salli/adapters/banks src/salli/application/services/bank_connection_service.py
          src/salli/interfaces/api/routers/banks.py
          src/salli/domain/llm.py src/salli/domain/model_choice.py src/salli/adapters/llm
          src/salli/application/services/llm_credential_service.py
          src/salli/application/services/chatgpt_connection_service.py
          src/salli/interfaces/api/routers/ai.py
          src/salli/domain/jurisdiction.py src/salli/domain/taxrules
          src/salli/domain/agents/jurisdiction.py src/salli/domain/agents/prompting.py
          src/salli/domain/fi/assumptions.py
          src/salli/domain/baseline src/salli/application/services/baseline_service.py
          src/salli/interfaces/api/routers/baseline.py
          src/salli/domain/canonical.py src/salli/domain/scenarios
          src/salli/domain/accounting/chain.py src/salli/application/entry_author.py
          src/salli/adapters/db/tax_returns.py
          src/salli/application/services/scenario_service.py
          src/salli/interfaces/api/routers/scenarios.py
          src/salli/domain/decisions src/salli/adapters/db/decisions.py
          src/salli/application/services/principle_service.py
          src/salli/application/services/decision_service.py
          src/salli/application/services/template_service.py
          src/salli/interfaces/api/routers/principles.py src/salli/interfaces/api/routers/decisions.py
          src/salli/domain/debt src/salli/application/services/debt_service.py
          src/salli/domain/portfolio/lots.py src/salli/domain/portfolio/valuation.py
          src/salli/domain/portfolio/returns.py src/salli/domain/portfolio/performance.py
          src/salli/application/market_data.py
          src/salli/application/services/portfolio_service.py
          src/salli/interfaces/api/routers/portfolio.py
          src/salli/application/permissions.py src/salli/adapters/net
          src/salli/application/services/personal_access_token_service.py
          src/salli/interfaces/api/routers/tokens.py src/salli/interfaces/api/routers/auth.py
          src/salli/application/services/login_service.py src/salli/adapters/auth
          src/salli/interfaces/api/routers/mcp_consent_page.py src/salli/config.py
          src/salli/adapters/storage/local.py
          src/salli/adapters/db/tax_rule_sets.py src/salli/adapters/db/tax_computations.py
          src/salli/application/services/tax_rule_service.py
          src/salli/application/services/tax_service.py src/salli/application/tax_deadlines.py
          src/salli/interfaces/api/routers/tax_rules.py src/salli/interfaces/api/routers/tax.py
          src/salli/domain/notifications src/salli/adapters/db/notifications.py
          src/salli/application/services/notification_service.py
          src/salli/interfaces/api/routers/notifications.py
          src/salli/interfaces/api/console.py src/salli/interfaces/api/routers/meta.py
          src/salli/application/services/mcp_oauth_service.py
          src/salli/interfaces/api/routers/mcp_oauth.py
      - name: Tests
        # Includes the contract tests: the OpenAPI document matches the app, and
        # salli-core carries no billing vocabulary. In parallel, one worker a
        # core (pytest-xdist): every database test makes a scratch database
        # of its own (tests/integration/pg.py), and a parametrized test whose
        # values are random names its ids, so every worker collects the same.
        run: uv run pytest -q -n auto

  cli:
    # The TypeScript packages (packages/): the SDK, the `salli` command line
    # and the console's type check, lint, component tests and build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        # Includes the money guard: no Number()/parseFloat() on an amount.
        run: npm run lint
      - name: Tests
        # Includes the API coverage test: every operation in openapi/openapi.json
        # is reached by a salli command, or exempt with a reason.
        run: npm test
      - name: Build
        # Includes the console's build and its budget (decision 14): over
        # 150 kB compressed for the shell and Home, 75 kB a page, 500 kB in
        # all or 40 kB of CSS fails.
        run: |
          npm run build
          node packages/cli/dist/salli.js --version
      - name: The generated SDK matches openapi/openapi.json
        run: npm run check:generated
      - name: npm has nothing to fix in the packages' package.json
        # npm silently rewrites what it considers invalid when it publishes
        # (salli 0.1.0's `./dist/salli.js` bin): publish what we wrote.
        run: |
          for p in packages/cli packages/sdk packages/console; do
            (cd "$p" && npm pkg fix)
            git diff --exit-code -- "$p/package.json"
          done

  console:
    # The console in a browser (packages/console/e2e/console.spec.ts): the
    # build served with the server's CSP and headers, the API answered from
    # the fixtures the server writes; axe on every page in both themes at
    # 360, 768 and 1280 px, visual regression against the committed
    # screenshots, and CSP violations or requests to another origin as
    # failures. In Playwright's own image, where the screenshots were made.
    # (End to end against compose runs in image.yml.)
    # Split across three runners (Playwright's --shard), each with its 4 workers.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: console (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - name: Build, within the budget
        run: npm run build --workspace @leafmonkeylabs/salli-console
      - name: Accessibility, visual regression, CSP and requests
        working-directory: packages/console
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - name: Report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-playwright-report-${{ matrix.shard }}
          path: |
            packages/console/playwright-report
            packages/console/test-results
          retention-days: 7

  cla-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tests for the CLA bot
        run: node --test .github/cla/check.test.js

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --redact --no-banner

  security:
    # Known vulnerabilities in what ships: the Python dependencies as uv.lock
    # pins them (without the dev group), and the npm packages' runtime
    # dependencies at high severity or above. A gate: each accepted advisory
    # is named below, with why (docs/security.md, "Accepted advisories").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.18"
      - name: pip-audit
        # PYSEC-2026-4146 (PyJWT, no fixed release): decode() changes an
        # options dict it is given when verify_signature is off. Salli never
        # turns it off and passes a new dict on every call.
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --strict --disable-pip --requirement "$RUNNER_TEMP/requirements.txt" \
            --ignore-vuln PYSEC-2026-4146
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: npm audit
        # npm audit --omit=dev --audit-level=high, but for the advisories in
        # .github/audit/npm-allowlist.json, each at the path it names.
        if: ${{ !cancelled() }}
        run: node .github/audit/npm-audit.mjs
