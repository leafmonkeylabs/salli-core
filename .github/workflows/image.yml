# The server's container image: ghcr.io/leafmonkeylabs/salli.
#
# On a pull request that touches it: lint the Dockerfile and compose.yaml,
# build the image for amd64 and arm64 (pushing nothing), and run compose.yaml
# end to end: up, set up an owner, sign in, health, the console in a browser
# (packages/console/e2e/compose.spec.ts), down.
#
# On a `server-v<version>` tag (see RELEASING.md): build both platforms and
# push them to GHCR as <version>, <major>.<minor> and, unless it is a
# pre-release, `latest`, with SBOM and provenance attestations. The push waits
# for a maintainer's approval in the `ghcr` environment.
#
# Run it by hand ("Run workflow") to rehearse a release: everything but the push.
#
# Third-party actions are pinned to commit SHAs: this workflow can publish.
name: Image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - pyproject.toml
      - uv.lock
      - src/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - packages/sdk/src/**
      - packages/console/**
      - .github/workflows/image.yml
  push:
    tags: ['server-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/leafmonkeylabs/salli

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - name: compose.yaml is valid
        run: docker compose config --quiet

  smoke:
    # compose.yaml as a self-hoster runs it, on the image this change builds.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SALLI_IMAGE: salli:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker compose build salli
      - name: Start
        run: docker compose up --detach --wait --wait-timeout 180
      - name: Set up an owner, sign in, check health
        run: |
          password="$(openssl rand -base64 24)"
          echo "::add-mask::$password"
          echo "SALLI_E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "SALLI_E2E_EMAIL=owner@example.org" >> "$GITHUB_ENV"
          printf '%s\n' "$password" | docker compose exec -T salli \
            salli-server setup --email owner@example.org --currency EUR --password-stdin
          docker compose exec -T salli salli-server doctor
          curl --fail --silent http://127.0.0.1:8000/healthz
          body=$(jq -n --arg p "$password" '{email: "owner@example.org", password: $p}')
          token=$(curl --fail --silent -X POST http://127.0.0.1:8000/v1/auth/sessions \
            -H 'Content-Type: application/json' -d "$body" | jq -r .token)
          echo "::add-mask::$token"
          curl --fail --silent http://127.0.0.1:8000/v1/auth/me -H "Authorization: Bearer $token" \
            | jq -e '.method == "session" and .email == "owner@example.org"'
      - name: The console is served, under its CSP
        run: |
          curl --fail --silent http://127.0.0.1:8000/v1/meta | jq -e '.console_url == "http://localhost:8000/console"'
          curl --fail --silent --head http://127.0.0.1:8000/console/ \
            | grep -i "^content-security-policy: .*require-trusted-types-for 'script'"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: The console end to end, in a browser
        # Signs in on the real sign-in page, sees Home, ends a sign-in, goes
        # through the step-up, signs out and is signed out when idle; weighs
        # a decision, records it after confirming, adds a note, and loads
        # every page of the decision lab.
        run: |
          npm ci
          cd packages/console
          npx playwright install --with-deps chromium
          npm run e2e:compose
      - name: Console report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-compose-report
          path: |
            packages/console/playwright-report-compose
            packages/console/test-results
          retention-days: 7
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Remove
        if: always()
        run: docker compose down --volumes

  build:
    # Both platforms, every time: a dependency without an arm64 wheel fails
    # here rather than at a release.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Which version
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag_version="${GITHUB_REF_NAME#server-v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME says $tag_version, but pyproject.toml says $version"
              exit 1
            fi
          fi
          case "$version" in *-*|*a*|*b*|*rc*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-v')
    needs: build
    runs-on: ubuntu-24.04
    # A maintainer approves every push (Settings → Environments → ghcr).
    environment: ghcr
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=match,pattern=server-v(\d+\.\d+)\.\d+$,group=1
            type=raw,value=latest,enable=${{ needs.build.outputs.prerelease == 'false' }}
      - name: Build and push, with SBOM and provenance
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.build.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
