[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salli-core"
version = "0.1.0"
description = "Self-hosted personal finance platform — ledger, budgets, investments, tax and FIRE. An HTTP API and an MCP server, with the salli-server operator CLI"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Leaf Monkey Labs" }]
requires-python = ">=3.12"
dependencies = [
    # Domain / core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # salli-server, the operator command line
    "typer[all]>=0.12",
    "rich>=13.0",
    # Agents
    "langchain>=0.2",
    "langchain-anthropic>=0.1",
    "langchain-community>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=1.0",
    "langgraph-supervisor>=0.0.31",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.1",
    "tavily-python>=0.5",
    # Document parsing
    "pdfplumber>=0.11",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    # Dedup
    "rapidfuzz>=3.0",
    # HTTP / utils
    "httpx>=0.27",
    # Encryption at rest for users' own LLM API keys (BYOK). Already present
    # transitively via python-jose[cryptography], but declared explicitly
    # because salli imports cryptography.fernet directly.
    "cryptography>=43.0",
    # Observability
    "structlog>=24.0",
    # API (Phase 2)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
    "mcp>=1.28.1,<2",  # 2.x renamed FastMCP (interfaces/api/mcp_server.py)
]

[project.urls]
Homepage = "https://github.com/leafmonkeylabs/salli-core"
Issues = "https://github.com/leafmonkeylabs/salli-core/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "hypothesis>=6.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pyright>=1.1",
    "beancount>=3.2.3",
]

[project.scripts]
salli-server = "salli.interfaces.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/salli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "B904", "SIM102", "SIM105", "UP042", "B017"]

[tool.ruff.lint.isort]
known-first-party = ["salli"]

[tool.pyright]
pythonVersion = "3.12"
# Migration revisions are rendered by Alembic and never edited by hand.
exclude = ["src/salli/migrations/versions", ".venv"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/salli"]
omit = ["tests/*"]
