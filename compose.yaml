# Salli, self-hosted: the server and its Postgres database.
#
#   docker compose up -d
#   docker compose exec salli salli-server setup
#
# Then, on your own computer: npm install --global @leafmonkeylabs/salli
# and salli login; salli ui opens the console, served at /console.
# docs/self-host.md has the rest: settings, HTTPS on your own domain, backups
# and upgrades.
#
# Settings go in a .env file next to this one (see .env.example); none is
# needed to start. Secrets are generated on the first run and kept in the
# `secrets` volume: none is ever written here.

name: salli

services:
  # Generates the server's secrets on the first run (the database password,
  # the encryption key for users' own AI keys, the MCP signing secret, the
  # cron secret), one file each, and never replaces one. Then exits.
  secrets:
    # A release, never :latest, so an upgrade is a choice (RELEASING.md bumps
    # it with the version; docs/self-host.md#upgrades).
    image: ${SALLI_IMAGE:-ghcr.io/leafmonkeylabs/salli:0.5.0}
    command: ["salli-server", "secrets", "init", "--dir", "/var/lib/salli/secrets"]
    volumes:
      - secrets:/var/lib/salli/secrets
    network_mode: none
    healthcheck:
      disable: true
    restart: "no"

  postgres:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    restart: unless-stopped
    environment:
      POSTGRES_USER: salli
      POSTGRES_DB: salli
      POSTGRES_PASSWORD_FILE: /run/salli-secrets/database_password
    volumes:
      - postgres:/var/lib/postgresql/data
      - secrets:/run/salli-secrets:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=salli --dbname=salli"]
      interval: 5s
      timeout: 5s
      retries: 30
    # Only Salli reaches the database: it is on no network with a way out,
    # and publishes no port.
    networks: [database]

  salli:
    image: ${SALLI_IMAGE:-ghcr.io/leafmonkeylabs/salli:0.5.0}
    # A checkout builds the image from source (`docker compose build`); with
    # just this file, the published image is pulled.
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Every setting in .env reaches Salli (docs/self-host.md lists them). The
    # file is optional.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://salli@postgres:5432/salli
      SALLI_SECRETS_DIR: /var/lib/salli/secrets
      SALLI_PUBLIC_URL: ${SALLI_PUBLIC_URL:-http://localhost:8000}
      # Believe X-Forwarded-For only from the bundled proxy, Caddy (the tls
      # profile), at its fixed address on the proxy network: sign-in
      # throttling counts by the address it gives, so nothing else may name
      # one. Behind a proxy of your own, set its address in .env.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-10.248.53.2}
    ports:
      - "${SALLI_BIND:-127.0.0.1}:${SALLI_PORT:-8000}:8000"
    volumes:
      - files:/var/lib/salli/files
      - secrets:/var/lib/salli/secrets:ro
    networks: [database, default, proxy]

  # Push alerts to phones, every 15 minutes (docs/self-host.md#scheduled-jobs).
  # Without a relay configured the job sends nothing.
  push:
    image: ${SALLI_IMAGE:-ghcr.io/leafmonkeylabs/salli:0.5.0}
    restart: unless-stopped
    depends_on:
      salli:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://salli@postgres:5432/salli
      SALLI_SECRETS_DIR: /var/lib/salli/secrets
      SALLI_PUBLIC_URL: ${SALLI_PUBLIC_URL:-http://localhost:8000}
    entrypoint: ["/bin/sh", "-c"]
    command: ["while :; do salli-server jobs send-push; sleep 900; done"]
    # It serves nothing; healthy while it runs, so `up --wait` waits for it.
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      start_period: 1s
    volumes:
      - secrets:/var/lib/salli/secrets:ro
    networks: [database, default]

  # HTTPS on your own domain: `docker compose --profile tls up -d`, with
  # SALLI_DOMAIN and SALLI_PUBLIC_URL (https://<domain>) in .env, and the
  # domain's DNS pointing here. Caddy gets and renews the certificate.
  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    profiles: [tls]
    restart: unless-stopped
    depends_on:
      - salli
    environment:
      SALLI_DOMAIN: ${SALLI_DOMAIN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test -n "$$SALLI_DOMAIN" || { echo "Set SALLI_DOMAIN in .env (see docs/self-host.md)." >&2; exit 1; };
        exec caddy reverse-proxy --from "$$SALLI_DOMAIN" --to salli:8000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy:
        ipv4_address: 10.248.53.2

networks:
  database:
    internal: true
  # Caddy to Salli, with Caddy at the one address Salli believes forwarded
  # headers from (FORWARDED_ALLOW_IPS).
  proxy:
    ipam:
      config:
        - subnet: 10.248.53.0/29

volumes:
  postgres:
  files:
  secrets:
  caddy_data:
  caddy_config:
