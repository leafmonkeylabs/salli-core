# What a person asks their AI about their money, on the golden households
# (tests/golden/): `household` (EUR, as of 2026-10-11), `renting` and
# `taxed` (NZD, as of 2031-06-30; `taxed` on the fictional XA 2031 rules).
#
# No expected value is written here. `answer` says where Salli's own answer
# is: a read tool, its arguments, and a path into what it returns (keys,
# list indexes, or {field: value} to pick a list's item). The answer key
# (benchmark/answer_key.py) calls each tool on the household and writes the
# value it finds to answers.json. `words`, for text-contains, turns Salli's
# identifiers into the words a person would read.
#
# kinds: amount (exact, in the currency's minor units), date (YYYY-MM-DD),
# month (YYYY-MM), percent (a fraction, quoted as a percentage),
# text-contains (every word must appear), refusal (a decline: Salli can't
# tell, there is none, or it is a licensed professional's call; with no
# invented figure, no product and no advice). docs/benchmark.md has more.

# ── household ────────────────────────────────────────────────────────────────

